<!DOCTYPE html>

<style>
body {
  margin: 0;
  background: #111;
}

#map {
  width: 1600px;
  height: 800px;
  display: block;
  margin: 0 auto;
}

/* 상단 전체 */
.top-bar {
  position: fixed;   /* ⭐ 핵심 */
  top: 0;
  left: 0;
  width: 100%;

  display: flex;
  height: 220px;
  background: #000;
  border-bottom: 2px solid #fff;

  z-index: 9999; /* ⭐ 다른 것 위에 올라오게 */
}

/* 아이콘 영역 (공격/방어 공통) */
.icon-panel {
  width: 360px;
  padding: 10px;
  display: grid;
  grid-template-columns: repeat(10, 30px);
  gap: 6px;
  align-content: start;
  border-right: 2px solid #333;
}

/* 아이콘 */
.icon {
  width: 30px;
  height: 30px;
  border: 2px solid #fff;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
}

.icon img {
  width: 100%;
  height: 100%;
}

/* 가젯 패널 전용 */
.gadget-panel {
  width: 360px;
  display: flex;
  flex-direction: column;
  border-right: 2px solid #333;
}

/* 위/아래 영역 */
.gadget-section {
  flex: 1;
  padding: 8px;
  display: grid;
  grid-template-columns: repeat(8, 40px);
  gap: 6px;
  align-content: start;
}

/* 가젯 아이콘 (40px) */
.gadget-icon {
  width: 35px;
  height: 35px;
  border: 2px solid #fff;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
}

.attack-gadgets .gadget-icon {
  border: 2px solid #ffd700; /* 노랑 */
}

.defense-gadgets .gadget-icon {
  border: 2px solid #7CFC00; /* 연두 */
}

.gadget-icon img {
  width: 100%;
  height: 100%;
}

.highlight-red {
  border: 2px solid red !important;
}

/* 툴 영역 */
.tool-panel {
  flex: 2;
  padding: 15px;
  display: flex;
  flex-direction: column;
  gap: 15px;
  color: white;
}

.tool-panel button {
  background: #222;
  color: white;
  border: 1px solid white;
  cursor: pointer;
  padding: 6px 10px;
}

/*맵 바꾸기*/
.map-row {
  display: flex;
  align-items: center;
  gap: 6px;           /* 버튼 간격 */
  margin-bottom: 15px; /* 줄 간격 */
}

.map-name {
  width: 95px;        /* 맵 이름 공간 */
  color: white;
  font-size: 15px;    /* 글씨 키움 */
  font-weight: bold;
}

.map-row button {
  padding: 4px 8px;   /* 버튼 크기 */
  font-size: 10px;
  cursor: pointer;
}
</style>

<script>
let mode = "draw";
let isDrawing = false;
let isDraggingIcon = false;

let actions = [];


let selectedIcon = {
  src: null,
  type: null
};
let icons = [];

let draggingIcon = null;
let selectedIconObj = null;
let iconImages = {};

let offsetX = 0;
let offsetY = 0;

let currentThickness = 5;
let currentDrawing = null;

const drawCanvas = document.getElementById("drawCanvas");
const drawCtx = drawCanvas.getContext("2d");

const iconCanvas = document.getElementById("iconCanvas");
const iconCtx = iconCanvas.getContext("2d");
const ICON_SIZE = 30;

const map = document.getElementById("map");
map.onload = resizeCanvas;
window.addEventListener("resize", resizeCanvas);

// 캔버스 맞춤
function resizeCanvas() {
  drawCanvas.width = map.clientWidth;
  drawCanvas.height = map.clientHeight;

  iconCanvas.width = map.clientWidth;
  iconCanvas.height = map.clientHeight;

  redrawFromActions(); // ⭐ 이거 추가
}

// 좌표
function getPos(e) {
  const rect = iconCanvas.getBoundingClientRect(); // ⭐ 변경
  return {
    x: e.clientX - rect.left,
    y: e.clientY - rect.top
  };
}

// 모드
function setMode(m) {
  mode = m;

  if (m !== "icon") {
    selectedIcon = null; // ⭐ 아이콘 모드 종료
  }
}

// 맵 변경
function changeMap(name) {
  map.src = name + ".png";

  setTimeout(() => {
    resizeCanvas();
    redrawFromActions(); // ⭐ 추가
  }, 50);
}

// ============================
// 🖱️ 이벤트
// ============================

iconCanvas.addEventListener("mousedown", (e) => {
  const { x, y } = getPos(e);

  isDraggingIcon = false;

  // 1️⃣ 아이콘 위 클릭 → 드래그
  for (let icon of icons) {
    const size = ICON_SIZE;

    if (
      x >= icon.x - size/2 &&
      x <= icon.x + size/2 &&
      y >= icon.y - size/2 &&
      y <= icon.y + size/2
    ) {
      draggingIcon = icon;
      selectedIconObj = icon;
      isDraggingIcon = true;

      offsetX = x - icon.x;
      offsetY = y - icon.y;
      return;
    }
  }

  // 2️⃣ 아이콘 생성 후 드로우 복귀
   if (mode === "icon" && selectedIcon) {
   const newIcon = {
    x,
    y,
    src: selectedIcon.src,
    type: selectedIcon.type
  };

  icons.push(newIcon);

  actions.push({
    type: "icon",
    icon: newIcon
  });

  selectedIconObj = newIcon;

  drawIcons();

  // 설치 후 자동 드로잉 복귀
   mode = "free";
   selectedIcon = null;

   return;
  }

  // 3️⃣ 그림
  if (mode !== "icon") {
    startDraw(e);
  }
});

iconCanvas.addEventListener("mousemove", (e) => {
  if (isDraggingIcon) {
    moveIcon(e);
  } else {
    if (mode !== "icon") {
      draw(e);
    }
  }
});

document.addEventListener("mouseup", endDraw);
iconCanvas.addEventListener("mouseleave", endDraw);

// ============================
// ✏️ 그림
// ============================

function startDraw(e) {
  const {x, y} = getPos(e);

  isDrawing = true;

  drawCtx.beginPath();
  drawCtx.moveTo(x, y);

  // ⭐ 새 액션 시작
  currentDrawing = {
  type: mode,
  points: [{ x, y }],
  color: document.getElementById("colorPicker").value,
  thickness: currentThickness
  };
}

function draw(e) {
  if (!isDrawing) return;

  const {x, y} = getPos(e);

  drawCtx.lineWidth = currentThickness;

  if (mode === "erase") {
    drawCtx.globalCompositeOperation = "destination-out";
  } else {
    drawCtx.globalCompositeOperation = "source-over";
    drawCtx.strokeStyle = document.getElementById("colorPicker").value;
  }

  drawCtx.lineTo(x, y);
  drawCtx.stroke();

  // ⭐ 현재 액션에 좌표 추가
  currentDrawing.points.push({ x, y });
}

// ============================
// 🧱 아이콘 이동
// ============================

function moveIcon(e) {
  if (!draggingIcon) return;

  const {x, y} = getPos(e);

  draggingIcon.x = x - offsetX;
  draggingIcon.y = y - offsetY;

  drawIcons(); // ⭐ 추가 (핵심)
}

// ============================
// 🧹 종료
// ============================

function endDraw() {
  if (currentDrawing) {
    actions.push(currentDrawing); // ⭐ 여기서만 추가
    currentDrawing = null;
  }

  isDrawing = false;
  isDraggingIcon = false;
  draggingIcon = null;

  drawCtx.beginPath();
  drawIcons();
}

// ============================
// 🧱 아이콘 이동
// ============================

function drawIcons() {
  const size = ICON_SIZE;

  iconCtx.clearRect(0, 0, iconCanvas.width, iconCanvas.height);

  icons.forEach(icon => {
    const img = iconImages[icon.src];
    if (!img || !img.complete) return;

    iconCtx.drawImage(
      img,
      icon.x - size / 2,
      icon.y - size / 2,
      size,
      size
    );

    if (icon.type === "important") {
      iconCtx.strokeStyle = "red";
    }
    else if (icon.type === "attack") {
      iconCtx.strokeStyle = "#ffcc00";
    }
    else if (icon.type === "defense") {
      iconCtx.strokeStyle = "#66ff66";
    }
    else {
      iconCtx.strokeStyle = "white";
    }

    iconCtx.lineWidth = 1;

    iconCtx.strokeRect(
      icon.x - size / 2,
      icon.y - size / 2,
      size,
      size
    );
  });
}

// ============================
// 기능들
// ============================

function selectIcon(src) {
  selectedIcon = {
    src: src,
    type: null
  };

  mode = "icon";

  // 강화벽
  if (src === "images/reinforce.png") {
    selectedIcon.type = "important";
  }

  // 공격 가젯
  if (
    src === "images/charge.png" ||
    src === "images/claymore.png" ||
    src === "images/smokegrenade.png" ||
    src === "images/frag.png" ||
    src === "images/flash.png" ||
    src === "images/hardbreachingcharge.png" ||
    src === "images/impact_emp_grenade.png"
  ) {
    selectedIcon.type = "attack";
  }

  // 방어 가젯
  if (
    src === "images/wire.png" ||
    src === "images/shield.png" ||
    src === "images/bulletproof.png" ||
    src === "images/impact.png" ||
    src === "images/nitro.png" ||
    src === "images/sensor.png" ||
    src === "images/observationblocker.png"
  ) {
    selectedIcon.type = "defense";
  }

  if (!iconImages[src]) {
    const img = new Image();
    img.src = src;
    iconImages[src] = img;
  }
}

function setThickness(value) {
  currentThickness = value;
  document.getElementById("thickness").value = value;
  document.querySelector("input[type=number]").value = value;
}

function undo() {
  if (actions.length === 0) return;

  const last = actions.pop();

  if (last.type === "icon") {
    // 아이콘 제거
    icons = icons.filter(i => i !== last.icon);
  }

  redrawFromActions();
}

function clearDrawings() {
  actions = actions.filter(action =>
    action.type === "icon"
  );

  redrawFromActions();
}

function clearIcons() {
  icons = [];

  actions = actions.filter(action =>
    action.type !== "icon"
  );

  selectedIconObj = null;

  drawIcons();
}

function clearCanvas() {
  actions = []; // ⭐ history 대신 actions 초기화
  icons = [];
  selectedIconObj = null;

  drawCtx.clearRect(0, 0, drawCanvas.width, drawCanvas.height);
  iconCtx.clearRect(0, 0, iconCanvas.width, iconCanvas.height);
}

// Delete 키 삭제
document.addEventListener("keydown", (e) => {
  if (e.key === "Delete" && selectedIconObj) {
    icons = icons.filter(i => i !== selectedIconObj);
    selectedIconObj = null;

    drawIcons(); // ⭐ 추가
  }
});

document.addEventListener("keydown", (e) => {
  // Ctrl + Z (윈도우)
  if (e.ctrlKey && e.key === "z") {
    e.preventDefault();
    undo();
  }

  // Cmd + Z (맥)
  if (e.metaKey && e.key === "z") {
    e.preventDefault();
    undo();
  }
});

function redrawFromActions() {
  drawCtx.clearRect(0, 0, drawCanvas.width, drawCanvas.height);

  actions.forEach(action => {

  // ⭐ 아이콘은 건너뜀
  if (action.type === "icon") return;

  drawCtx.beginPath();
  drawCtx.lineWidth = action.thickness;

  if (action.type === "erase") {
    drawCtx.globalCompositeOperation = "destination-out";
  } else {
    drawCtx.globalCompositeOperation = "source-over";
    drawCtx.strokeStyle = action.color;
  }

  const pts = action.points;

  drawCtx.moveTo(pts[0].x, pts[0].y);

  for (let i = 1; i < pts.length; i++) {
    drawCtx.lineTo(pts[i].x, pts[i].y);
  }

  drawCtx.stroke();
  });

  drawIcons(); // 아이콘 유지
}

function saveAsImage() {
  const tempCanvas = document.createElement("canvas");
  const ctx = tempCanvas.getContext("2d");

  tempCanvas.width = map.clientWidth;
  tempCanvas.height = map.clientHeight;

  // ⭐ 이미지 로딩 확인
  if (!map.complete) {
    alert("맵 로딩 중입니다!");
    return;
  }

  // 1️⃣ 맵
  ctx.drawImage(map, 0, 0, tempCanvas.width, tempCanvas.height);

  // 2️⃣ 그림
  ctx.drawImage(drawCanvas, 0, 0);

  // 3️⃣ 아이콘
  ctx.drawImage(iconCanvas, 0, 0);

  // 4️⃣ 다운로드
  const link = document.createElement("a");
  link.download = "map_capture.jpg";
  link.href = tempCanvas.toDataURL("image/jpeg", 0.95);
  link.click();
}

</script>
