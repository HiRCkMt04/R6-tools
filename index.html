<!DOCTYPE html>

<meta charset="UTF-8">

<style>
body {
  margin: 0;
  background: #111;
}

/* 상단 전체 */
.top-bar {
  display: flex;
  height: 220px;
  background: #000;
  border-bottom: 2px solid #fff;
}

/* 아이콘 영역 (공격/방어 공통) */
.icon-panel {
  width: 360px;
  padding: 10px;
  display: grid;
  grid-template-columns: repeat(10, 30px);
  gap: 6px;
  align-content: start;
  border-right: 2px solid #333;
}

/* 아이콘 */
.icon {
  width: 30px;
  height: 30px;
  border: 2px solid #fff;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
}

.icon img {
  width: 100%;
  height: 100%;
}

/* 가젯 패널 전용 */
.gadget-panel {
  width: 360px;
  display: flex;
  flex-direction: column;
  border-right: 2px solid #333;
}

/* 위/아래 영역 */
.gadget-section {
  flex: 1;
  padding: 8px;
  display: grid;
  grid-template-columns: repeat(8, 40px);
  gap: 6px;
  align-content: start;
}

/* 가젯 아이콘 (40px) */
.gadget-icon {
  width: 40px;
  height: 40px;
  border: 2px solid #fff;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
}

.gadget-icon img {
  width: 100%;
  height: 100%;
}

/* 툴 영역 */
.tool-panel {
  flex: 1;
  padding: 15px;
  display: flex;
  flex-direction: column;
  gap: 15px;
  color: white;
}

.tool-panel button {
  background: #222;
  color: white;
  border: 1px solid white;
  cursor: pointer;
  padding: 6px 10px;
}
</style>

<script>
let mode = "draw";
let isDrawing = false;
let isDraggingIcon = false;

let actions = [];

let selectedIcon = null;
let icons = [];

let draggingIcon = null;
let selectedIconObj = null;
let iconImages = {};

let offsetX = 0;
let offsetY = 0;

let currentThickness = 5;

const drawCanvas = document.getElementById("drawCanvas");
const drawCtx = drawCanvas.getContext("2d");

const iconCanvas = document.getElementById("iconCanvas");
const iconCtx = iconCanvas.getContext("2d");

const map = document.getElementById("map");
map.onload = resizeCanvas;
window.addEventListener("resize", resizeCanvas);

// 캔버스 맞춤
function resizeCanvas() {
  drawCanvas.width = map.clientWidth;
  drawCanvas.height = map.clientHeight;

  iconCanvas.width = map.clientWidth;
  iconCanvas.height = map.clientHeight;

  redrawFromActions(); // ⭐ 이거 추가
}

// 좌표
function getPos(e) {
  const rect = iconCanvas.getBoundingClientRect(); // ⭐ 변경
  return {
    x: e.clientX - rect.left,
    y: e.clientY - rect.top
  };
}

// 모드
function setMode(m) {
  mode = m;

  if (m !== "icon") {
    selectedIcon = null; // ⭐ 아이콘 모드 종료
  }
}

// 맵 변경
function changeMap(name) {
  map.src = + name + ".png";

  setTimeout(() => {
    resizeCanvas();
    redrawFromActions(); // ⭐ 추가
  }, 50);
}

// ============================
// 🖱️ 이벤트
// ============================

iconCanvas.addEventListener("mousedown", (e) => {
  const { x, y } = getPos(e);

  isDraggingIcon = false;

  // 1️⃣ 아이콘 위 클릭 → 드래그
  for (let icon of icons) {
    const size = 40;

    if (
      x >= icon.x - size/2 &&
      x <= icon.x + size/2 &&
      y >= icon.y - size/2 &&
      y <= icon.y + size/2
    ) {
      draggingIcon = icon;
      selectedIconObj = icon;
      isDraggingIcon = true;

      offsetX = x - icon.x;
      offsetY = y - icon.y;
      return;
    }
  }

  // 2️⃣ 아이콘 생성 (빈 공간일 때만)
  if (mode === "icon" && selectedIcon) {
    const newIcon = { x, y, src: selectedIcon };
    icons.push(newIcon);
    selectedIconObj = newIcon;

    drawIcons();
    return;
  }

  // 3️⃣ 그림
  if (mode !== "icon") {
    startDraw(e);
  }
});

iconCanvas.addEventListener("mousemove", (e) => {
  if (isDraggingIcon) {
    moveIcon(e);
  } else {
    if (mode !== "icon") {
      draw(e);
    }
  }
});

document.addEventListener("mouseup", endDraw);
iconCanvas.addEventListener("mouseleave", endDraw);

// ============================
// ✏️ 그림
// ============================

function startDraw(e) {
  const {x, y} = getPos(e);

  isDrawing = true;

  drawCtx.beginPath();
  drawCtx.moveTo(x, y);

  // ⭐ 새 액션 시작
  actions.push({
    type: mode,
    points: [{ x, y }],
    color: document.getElementById("colorPicker").value,
    thickness: currentThickness
  });
}

function draw(e) {
  if (!isDrawing) return;

  const {x, y} = getPos(e);

  drawCtx.lineWidth = currentThickness;

  if (mode === "erase") {
    drawCtx.globalCompositeOperation = "destination-out";
  } else {
    drawCtx.globalCompositeOperation = "source-over";
    drawCtx.strokeStyle = document.getElementById("colorPicker").value;
  }

  drawCtx.lineTo(x, y);
  drawCtx.stroke();

  // ⭐ 현재 액션에 좌표 추가
  const currentAction = actions[actions.length - 1];
  currentAction.points.push({ x, y });
}

// ============================
// 🧱 아이콘 이동
// ============================

function moveIcon(e) {
  if (!draggingIcon) return;

  const {x, y} = getPos(e);

  draggingIcon.x = x - offsetX;
  draggingIcon.y = y - offsetY;

  drawIcons(); // ⭐ 추가 (핵심)
}

// ============================
// 🧹 종료
// ============================

function endDraw() {
  isDrawing = false;
  isDraggingIcon = false;
  draggingIcon = null;

  drawCtx.beginPath();
  drawIcons();
}

// ============================
// 🧱 아이콘 이동
// ============================

function drawIcons() {
  const size = 40; // ⭐ 여기서 크기 통일

  iconCtx.clearRect(0, 0, iconCanvas.width, iconCanvas.height);

  icons.forEach(icon => {
    const img = iconImages[icon.src];
    if (!img || !img.complete) return;

    // 아이콘
    iconCtx.drawImage(
      img,
      icon.x - size / 2,
      icon.y - size / 2,
      size,
      size
    );

    // ⭐ 기본 테두리 (모든 아이콘)
    iconCtx.strokeStyle = "white";
    iconCtx.lineWidth = 2;
    iconCtx.strokeRect(
      icon.x - size / 2,
      icon.y - size / 2,
      size,
      size
    );

  });
}

// ============================
// 기능들
// ============================

function selectIcon(src) {
  selectedIcon = src;
  mode = "icon"; // ⭐ 아이콘 모드 진입

  if (!iconImages[src]) {
    const img = new Image();
    img.src = src;
    iconImages[src] = img;
  }
}

function setThickness(value) {
  currentThickness = value;
  document.getElementById("thickness").value = value;
  document.querySelector("input[type=number]").value = value;
}

function undo() {
  if (actions.length === 0) return;

  actions.pop(); // ⭐ 마지막 작업 삭제
  redrawFromActions();
}

function clearCanvas() {
  actions = []; // ⭐ history 대신 actions 초기화
  icons = [];
  selectedIconObj = null;

  drawCtx.clearRect(0, 0, drawCanvas.width, drawCanvas.height);
  iconCtx.clearRect(0, 0, iconCanvas.width, iconCanvas.height);
}

// Delete 키 삭제
document.addEventListener("keydown", (e) => {
  if (e.key === "Delete" && selectedIconObj) {
    icons = icons.filter(i => i !== selectedIconObj);
    selectedIconObj = null;

    drawIcons(); // ⭐ 추가
  }
});

function redrawFromActions() {
  drawCtx.clearRect(0, 0, drawCanvas.width, drawCanvas.height);

  actions.forEach(action => {
    drawCtx.beginPath();
    drawCtx.lineWidth = action.thickness;

    if (action.type === "erase") {
      drawCtx.globalCompositeOperation = "destination-out";
    } else {
      drawCtx.globalCompositeOperation = "source-over";
      drawCtx.strokeStyle = action.color;
    }

    const pts = action.points;

    drawCtx.moveTo(pts[0].x, pts[0].y);

    for (let i = 1; i < pts.length; i++) {
      drawCtx.lineTo(pts[i].x, pts[i].y);
    }

    drawCtx.stroke();
  });

  drawIcons(); // 아이콘 유지
}

</script>
